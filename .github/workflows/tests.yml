name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install safetensors

      - name: Tests
        run: pytest -q

      - name: DSP path must not need torch
        run: python examples/04_no_torch.py

      - name: Examples
        run: |
          python examples/02_edit_spec.py
          python examples/03_variants.py --n 2
          python examples/01_generate.py
