[project]
name = "orb"
version = "0.1.0"
description = "A tiny, from-scratch audio engine for agents: caption -> Spec -> DSP -> 48 kHz audio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marcos Maceo", email = "marcosmaceowork@gmail.com" }]
keywords = [
  "audio",
  "sound-effects",
  "text-to-audio",
  "procedural-audio",
  "dsp",
  "agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["torch>=2.4", "safetensors>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
orb-generate = "orb.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_ORG/orb-audio"
Repository = "https://github.com/YOUR_ORG/orb-audio"
Issues = "https://github.com/YOUR_ORG/orb-audio/issues"
Model = "https://huggingface.co/YOUR_HF_USER/orb-planner"
Dataset = "https://huggingface.co/datasets/YOUR_HF_USER/orb-scores-100k"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
